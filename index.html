<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCFOLIA 聊天室辨識樣式工具</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#1a202b;--line:#343d4d;--text:#eef2f8;--muted:#aab5c6;--accent:#7da9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}h1{font-size:1.55rem;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:650;margin-bottom:6px}input[type=file],input[type=text],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#10151e;color:var(--text)}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.check{display:flex;align-items:flex-start;gap:9px;font-weight:500}.check input{margin-top:5px}
button{border:0;border-radius:9px;padding:11px 15px;background:var(--accent);color:#101725;font-weight:750;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.note{font-size:.9rem;color:var(--muted)}.status{margin-top:10px;color:#b9d5ff;overflow-wrap:anywhere}
.preview{background:#0d1016;border-radius:10px;padding:12px;max-height:65vh;overflow:auto}.msg{position:relative;padding:13px 14px;margin:0 0 10px;background:#171c25;border:1px solid #2b3340;border-radius:10px;overflow-wrap:anywhere}.meta{font-size:.86rem;color:#aeb9c9;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}.room{font-weight:800}.speaker{font-weight:750}.msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}.msg img{max-width:100%;height:auto}
.msg.mode-bg{background:var(--room-bg,#202633)}.msg.mode-border{border-left:5px solid var(--room-color,#8795aa)}.msg.mode-label{padding-left:16px}.side-label{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:10px 0 0 10px;background:var(--room-color,#8795aa)}.msg.mode-tag .room{display:inline-block;border:1px solid var(--room-color,#8795aa);border-radius:5px;padding:1px 7px;background:#111722}.msg.mode-stripe{background:linear-gradient(90deg,var(--room-tint,#202633),#171c25 36%)}
.msg.hide-room .room{display:none}.msg.mode-bg .room{color:var(--room-text,#fff)}.msg.system{font-style:italic;color:#aeb8c8}
@media(max-width:600px){main{padding:14px 10px 40px}.panel{padding:12px}.preview{padding:7px}.msg{padding:11px}.meta{gap:5px}}
</style></head>
<body><main>
<h1>CCFOLIA 聊天室辨識樣式工具</h1>
<p class="sub">匯入 CCFOLIA 匯出的 HTML 聊天紀錄，選擇辨識方式、預覽後輸出新的 HTML。原始檔不會被修改。</p>
<section class="panel">
<label for="file">① 選擇聊天紀錄 HTML</label><input id="file" type="file" accept=".html,.htm,text/html">
<p class="note">支援兩種格式：舊版以每則訊息的 <code>&lt;p&gt;</code> 保存、聊天室標籤位於第一個 span；新版以 <code>.message</code> / <code>.channel-name</code> 保存。工具會保留訊息文字、換行及訊息順序。</p>
<div id="status" class="status">尚未載入檔案。</div>
</section>
<section class="panel">
<h2 style="font-size:1.1rem;margin-top:0">② 選擇辨識方式</h2>
<div class="options">
<label class="check"><input type="checkbox" id="bg" checked> <span>聊天室背景色<br><small class="note">每個聊天室使用不同淡色背景</small></span></label>
<label class="check"><input type="checkbox" id="border" checked> <span>左側彩色外框<br><small class="note">快速掃視時辨識更明顯</small></span></label>
<label class="check"><input type="checkbox" id="tag" checked> <span>聊天室標籤膠囊<br><small class="note">在訊息資訊列顯示標籤</small></span></label>
<label class="check"><input type="checkbox" id="side"> <span>側邊色條<br><small class="note">以細色條輔助辨識</small></span></label>
<label class="check"><input type="checkbox" id="stripe"> <span>左側漸層底色<br><small class="note">較低干擾的區分方式</small></span></label>
<label class="check"><input type="checkbox" id="hide"> <span>隱藏重複聊天室標籤<br><small class="note">不建議和其他標籤樣式一起使用</small></span></label>
<label class="check"><input type="checkbox" id="group"> <span>聊天室切換時加分隔標題<br><small class="note">連續訊息換聊天室時插入醒目標題</small></span></label>
<label class="check"><input type="checkbox" id="speaker" checked> <span>保留說話者名稱與原色</span></label>
</div>
<div class="options" style="margin-top:14px">
<div><label for="palette">配色方案</label><select id="palette"><option value="soft">柔和低彩度（推薦）</option><option value="vivid">高辨識度</option><option value="mono">灰階＋彩色標記</option></select></div>
<div><label for="width">內容寬度</label><select id="width"><option value="960">960px（閱讀舒適）</option><option value="1200">1200px（桌面寬版）</option><option value="100%">全寬</option></select></div>
<div><label for="title">輸出頁面標題（可修改）</label><input id="title" type="text" value="CCFOLIA 聊天紀錄（聊天室辨識版）"></div>
</div>
<div class="actions"><button id="previewBtn" disabled>③ 產生／更新預覽</button><button id="downloadBtn" disabled>④ 下載全新 HTML</button></div>
</section>
<section class="panel"><h2 style="font-size:1.1rem;margin-top:0">預覽</h2><p class="note">預覽最多顯示前 250 則，避免手機載入大量訊息時卡頓；下載檔會包含完整訊息。</p><div id="preview" class="preview">載入檔案後按「產生／更新預覽」。</div></section>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);let sourceMessages=[],sourceName='chatlog.html',detectedFormat='',lastOutput='';
const palettes={
 soft:[['#e5edf9','#385b8c','#172a43'],['#f9e9df','#9a5c3d','#3c251a'],['#e5f3e8','#39764c','#193323'],['#f3e7fa','#80509b','#321d40'],['#f8f0cf','#8b7528','#342b10'],['#e5f0f0','#3f7777','#183333'],['#f6e1e8','#a34e6c','#401e2a']],
 vivid:[['#d8e8ff','#1764c0','#10294a'],['#ffe0ce','#c6531c','#4a210d'],['#d7f8df','#17813a','#10351d'],['#f0dcff','#8536b8','#351348'],['#fff2b8','#a17c00','#453400'],['#d4fbfa','#087d80','#0b393a'],['#ffdce6','#b52855','#4d1024']],
 mono:[['#e7e7e7','#666','#222'],['#ddd','#888','#222'],['#eee','#555','#222'],['#d4d4d4','#777','#222'],['#f0f0f0','#444','#222'],['#e2e2e2','#666','#222'],['#d9d9d9','#888','#222']]
};
function clean(s){return (s||'').replace(/\s+/g,' ').trim()}
function roomFrom(text){let t=clean(text);let m=t.match(/^\[([^\]]+)\]/);return m?'['+m[1]+']':'[未分類]'}
function addMessage(room,speaker,time,content,color,system){sourceMessages.push({room:roomFrom(room),speaker:clean(speaker)||'未知說話者',time:clean(time),content:content||'',color:color||'',system:!!system})}
function parse(html){
 sourceMessages=[];const doc=new DOMParser().parseFromString(html,'text/html');
 const modern=doc.querySelectorAll('.message').length>0;
 if(modern){
  doc.querySelectorAll('.message').forEach(el=>{
   const ch=el.querySelector('.channel-name'),sp=el.querySelector('.speaker'),tm=el.querySelector('time'),tx=el.querySelector('.message-text');
   if(!tx)return;
   const col=sp?(sp.style.getPropertyValue('--speaker-color')||((sp.getAttribute('style')||'').match(/color\s*:\s*(#[\da-f]+)/i)||[])[1]||''):'';
   addMessage(ch?ch.textContent:'',sp?sp.textContent:'',tm?(tm.textContent||tm.getAttribute('datetime')):'',tx.innerHTML,col,el.classList.contains('system'));
  });detectedFormat='新版（.message / .channel-name）';
 }else{
  doc.querySelectorAll('body > p, body p').forEach(el=>{
   const spans=Array.from(el.children).filter(x=>x.tagName==='SPAN');
   if(spans.length<2)return;
   let room='',speaker='',content='',color=el.style.color||'';
   room=spans[0].textContent;speaker=spans[1].textContent;
   const colon=Array.from(el.childNodes).find(n=>n.nodeType===3&&n.textContent.includes(':'));
   // The message body is normally the last span, which also preserves line breaks.
   content=spans.length>=3?spans.slice(2).map(x=>x.innerHTML).join(' '):'';
   if(!content){const all=el.querySelectorAll('span');if(all.length>=3)content=all[all.length-1].innerHTML}
   if(!content){
    const raw=el.innerHTML;let after=raw;
    const matches=[...raw.matchAll(/<\/span>/gi)];if(matches.length>=2)after=raw.slice(matches[1].index+7).replace(/^\s*:\s*/,'').replace(/<\/p>\s*$/i,'');
    content=after;
   }
   addMessage(room,speaker,'',content,color,room.includes('[main]'));
  });
  detectedFormat='舊版（每則訊息以 <p> 保存）';
 }
 return {count:sourceMessages.length,format:detectedFormat};
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildOutput(limit){
 const opts={bg:$('bg').checked,border:$('border').checked,tag:$('tag').checked,side:$('side').checked,stripe:$('stripe').checked,hide:$('hide').checked,group:$('group').checked,speaker:$('speaker').checked};
 const palette=palettes[$('palette').value]||palettes.soft,rooms=[...new Set(sourceMessages.map(m=>m.room))],map={};rooms.forEach((r,i)=>map[r]=palette[i%palette.length]);
 const width=$('width').value,title=$('title').value.trim()||'CCFOLIA 聊天紀錄';
 let body='',prev='';
 sourceMessages.slice(0,limit||sourceMessages.length).forEach(m=>{
  const c=map[m.room]||palette[0],classes=['msg'];if(opts.bg)classes.push('mode-bg');if(opts.border)classes.push('mode-border');if(opts.tag)classes.push('mode-tag');if(opts.side)classes.push('mode-side');if(opts.stripe)classes.push('mode-stripe');if(opts.hide)classes.push('hide-room');if(m.system)classes.push('system');
  if(opts.group&&m.room!==prev)body+='<div class="room-divider" style="--room-color:'+c[1]+'"><span>'+escapeHtml(m.room)+'</span></div>';
  body+='<article class="'+classes.join(' ')+'" style="--room-bg:'+c[0]+';--room-color:'+c[1]+';--room-text:'+c[2]+';--room-tint:'+c[0]+'">'+(opts.side?'<i class="side-label"></i>':'')+'<div class="meta"><span class="room" style="color:'+c[1]+'">'+escapeHtml(m.room)+'</span>'+(opts.speaker?'<span class="speaker" '+(m.color?'style="color:'+escapeHtml(m.color)+'"':'')+'>'+escapeHtml(m.speaker)+'</span>':'<span class="speaker">'+escapeHtml(m.speaker)+'</span>')+(m.time?'<time>'+escapeHtml(m.time)+'</time>':'')+'</div><div class="content">'+m.content+'</div></article>';
  prev=m.room;
 });
 return '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+escapeHtml(title)+'</title><style>'+
 ' :root{color-scheme:dark;background:#10131a;color:#edf1f7}*{box-sizing:border-box}body{margin:0;background:#10131a;color:#edf1f7;font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:'+width+';margin:auto;padding:20px 16px 60px}h1{font-size:1.5rem}.msg{position:relative;padding:13px 14px;margin:0 0 10px;background:#171c25;border:1px solid #2b3340;border-radius:10px;overflow-wrap:anywhere}.meta{display:flex;gap:9px;flex-wrap:wrap;font-size:.86rem;color:#aeb9c9;margin-bottom:6px}.speaker{font-weight:750}.room{font-weight:800}.content p{margin:0 0 8px}.content img{max-width:100%;height:auto}.mode-bg{background:var(--room-bg)}.mode-border{border-left:5px solid var(--room-color)}.mode-tag .room{display:inline-block;border:1px solid var(--room-color);border-radius:5px;padding:0 7px;background:#111722}.mode-stripe{background:linear-gradient(90deg,var(--room-tint),#171c25 38%)}.side-label{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:10px 0 0 10px;background:var(--room-color)}.hide-room .room{display:none}.system{font-style:italic;color:#aeb8c8}.room-divider{margin:22px 0 12px;padding:8px 12px;border-left:6px solid var(--room-color);background:#202633;font-weight:800;border-radius:5px}.room-divider span{color:#fff}@media(max-width:600px){.wrap{padding:12px 8px 40px}.msg{padding:11px}.meta{gap:6px}}'+
 '</style></head><body><main class="wrap"><h1>'+escapeHtml(title)+'</h1><p>共 '+sourceMessages.length+' 則訊息｜聊天室辨識版</p>'+body+'</main></body></html>';
}
function renderPreview(){
 const html=buildOutput(250);lastOutput=buildOutput();const doc=new DOMParser().parseFromString(html,'text/html');$('preview').innerHTML=doc.body.innerHTML;
 $('downloadBtn').disabled=!sourceMessages.length;
}
$('file').addEventListener('change',async e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;sourceName=f.name;
 try{const html=await f.text();const r=parse(html);$('status').textContent='已載入：'+f.name+'｜格式判定：'+r.format+'｜解析到 '+r.count+' 則訊息'+(r.count===0?'。未能辨識格式，請確認是否為 CCFOLIA 匯出的 HTML。':'。');
 $('previewBtn').disabled=r.count===0;$('downloadBtn').disabled=true;$('preview').textContent=r.count?'按「產生／更新預覽」查看樣式。':'沒有解析到訊息。';
 }catch(err){$('status').textContent='讀取失敗：'+err.message}
});
$('previewBtn').addEventListener('click',renderPreview);
['bg','border','tag','side','stripe','hide','group','speaker','palette','width','title'].forEach(id=>$(id).addEventListener('change',()=>{if(sourceMessages.length)renderPreview()}));
$('downloadBtn').addEventListener('click',()=>{
 if(!lastOutput)lastOutput=buildOutput();const blob=new Blob([lastOutput],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=(sourceName.replace(/\.(html?|HTML?)$/,'')||'chatlog')+'_聊天室辨識版.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
})();
</script></body></html>
